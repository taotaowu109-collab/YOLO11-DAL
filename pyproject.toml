[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo11-dal"
version = "0.1.0"
description = "Paper-faithful reconstruction of YOLO11-DAL for UAV power-line inspection"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.3",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["yolo11_dal*"]
